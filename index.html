<style>
/*
 * Locus: cream-tan paper with dark red-brown lettering. One look on every device (no dark mode),
 * so the page never turns into a dark brown background.
 */
:root {
  color-scheme: light;
  --bg: #efe4cb;
  --card: #f8f1de;
  --ink: #4a2a22;
  --muted: #7a5a4c;
  --accent: #86342a;
  --accent-ink: #fbf3e4;
  --line: #d3bf9a;
  --hl: #ecd49a;
  --err: #9c2a1a;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
  line-height: 1.55;
}

header.site, footer.site, main { max-width: 42rem; margin: 0 auto; padding: 0 1rem; }
header.site { padding-top: 2rem; padding-bottom: 1rem; }
header.site h1 { margin: 0; font-size: 2.6rem; font-weight: bold; letter-spacing: 0.04em; color: var(--accent); line-height: 1.1; }
header.site p { margin: 0.1rem 0 0; color: var(--muted); font-style: italic; }
footer.site { padding-top: 1.5rem; padding-bottom: 2rem; color: var(--muted); font-size: 0.8rem; }

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 1.25rem 1.25rem 1.5rem;
}

.card h2 { margin-top: 0; }
.status { display: flex; justify-content: space-between; color: var(--muted); font-size: 0.9rem; margin-bottom: 1rem; }
.prompt { margin: 0 0 0.5rem; font-weight: bold; }
.muted { color: var(--muted); }
.error { color: var(--err); min-height: 1.2em; margin: 0.5rem 0 0; }
.rules { padding-left: 1.2rem; }

.quote {
  margin: 0 0 1.25rem;
  padding: 0.25rem 0 0.25rem 1rem;
  border-left: 4px solid var(--accent);
  font-size: 1.3rem;
  font-style: italic;
}

.guess { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 0.75rem; }
.guess label { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.85rem; color: var(--muted); }
.guess .actions, .guess .error { grid-column: 1 / -1; }

.guess .error:not(:empty) {
  padding: 0.55rem 0.75rem;
  border: 1px solid var(--err);
  border-radius: 6px;
  font-weight: bold;
}

input, select {
  font: inherit;
  font-size: 1.05rem;
  padding: 0.55rem 0.6rem;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--bg);
  color: var(--ink);
  width: 100%;
}

input:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; margin-top: 0.25rem; }

button { font: inherit; cursor: pointer; border-radius: 6px; padding: 0.6rem 1.1rem; border: 1px solid transparent; }
button:disabled { opacity: 0.5; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-ink); }
button.secondary { background: transparent; color: var(--ink); border-color: var(--line); }
button.link { background: none; color: var(--muted); text-decoration: underline; padding-left: 0; }

.result { margin-top: 1.25rem; border-top: 1px solid var(--line); padding-top: 1rem; }
.result:empty { display: none; }
.result p { margin: 0.3rem 0; }
.points { font-size: 2rem; font-weight: bold; color: var(--accent); }
.points.big { font-size: 3.2rem; }
.points .of { font-size: 1rem; font-weight: normal; color: var(--muted); }
.answer { font-weight: bold; font-size: 1.15rem; }

.context { margin-top: 1rem; padding: 0.75rem 1rem; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.context[hidden] { display: none; }
.verse { margin: 0.4rem 0; }
.verse sup { color: var(--muted); font-size: 0.7rem; }
.verse.target { background: var(--hl); border-radius: 4px; padding: 0.15rem 0.35rem; }
.context a { color: var(--accent); font-size: 0.9rem; }

.review { padding-left: 1.4rem; }
.review li { margin: 0.25rem 0; }
.review .pts { color: var(--muted); }
.review blockquote { margin: 0.2rem 0 0.8rem; color: var(--muted); font-size: 0.9rem; font-style: italic; }

pre { overflow-x: auto; padding: 0.75rem 1rem; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; font-size: 0.85rem; }

@media (max-width: 30rem) {
  .guess { grid-template-columns: 1fr 1fr; }
  .guess label:first-child { grid-column: 1 / -1; }
}

a { color: var(--accent); }
fieldset.modes { border: 1px solid var(--line); border-radius: 8px; margin: 1rem 0; padding: 0.4rem 1rem 0.6rem; }
.modes legend { padding: 0 0.4rem; color: var(--muted); font-size: 0.85rem; }
.modes label { display: flex; gap: 0.6rem; align-items: flex-start; margin: 0.5rem 0; cursor: pointer; }
.modes input { width: auto; margin-top: 0.4rem; }
.setup ol { padding-left: 1.2rem; }
.field { display: flex; flex-direction: column; gap: 0.25rem; margin: 0.9rem 0; font-size: 0.85rem; color: var(--muted); }
pre.error { white-space: pre-wrap; font-family: inherit; }
.guess .error:empty { display: none; }
select { width: 100%; }
.book-field { position: relative; }
.suggest {
  position: absolute; left: 0; right: 0; top: 100%; z-index: 10;
  margin: 2px 0 0; padding: 0; list-style: none;
  background: var(--card); border: 1px solid var(--line); border-radius: 6px;
  box-shadow: 0 4px 12px rgba(74, 42, 34, 0.18);
  max-height: 9.5rem; overflow-y: auto;
}
.suggest[hidden] { display: none; }
.suggest li { padding: 0.5rem 0.7rem; font-size: 1.05rem; color: var(--ink); cursor: pointer; }
.suggest li.active, .suggest li:hover { background: var(--hl); }
.result .actions { margin-top: 0.9rem; }
pre.share { white-space: pre-wrap; font-family: inherit; font-size: 1.05rem; }

.guess .help { grid-column: 1 / -1; margin-top: -0.4rem; }
.chapterbox { margin: 1rem 0; padding: 0.75rem 1rem; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); max-height: 20rem; overflow-y: auto; }
.chapterbox[hidden] { display: none; }
.leave { margin: 0.6rem 0 0; text-align: center; }
.leave button.link { padding: 0.3rem 0.5rem; font-size: 0.9rem; }

.foot-links { margin: 0.9rem 0 0; }
.foot-links .link { padding-left: 0; }
button.link.small { font-size: 0.8rem; }
.card .foot-links { margin-top: 1rem; }
main > .foot-links { padding: 0 0.25rem; }
.breakdown h2.big { font-size: 1.9rem; font-weight: bold; margin: 0 0 0.6rem; }
.breakdown h2 { margin-top: 1.8rem; }
.breakdown h3 { font-size: 1.1rem; font-weight: bold; margin: 1.3rem 0 0.3rem; }
.breakdown ul { padding-left: 1.2rem; }
.breakdown li { margin: 0.3rem 0; }
details.past { border-top: 1px solid var(--line); padding: 0.55rem 0; }
details.past summary { cursor: pointer; display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: baseline; }
details.past .pts { color: var(--muted); }
details.past .marks { letter-spacing: 0.05em; }
.review-body { margin-top: 0.6rem; }

.creator-note { margin: 1.4rem 0 0; padding: 0.1rem 0 0.1rem 0.9rem; border-left: 3px solid var(--line); color: var(--muted); font-size: 0.74rem; line-height: 1.5; }
.creator-note p { margin: 0.35rem 0; font-style: italic; }
.creator-note .note-label { font-style: normal; font-variant: small-caps; letter-spacing: 0.06em; font-size: 0.72rem; margin-bottom: 0.1rem; }

/* Koine Greek: a quiet row beneath Begin and Daily, so it never competes with them. */
.greek-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin-top: 0.9rem; }
.greek-row .cap { font-size: 0.8rem; color: var(--muted); }
button.small { font-size: 0.85rem; padding: 0.35rem 0.8rem; }
.greek-text { font-style: normal; font-family: "Gentium Plus", "Gentium Book Plus", "Cardo", "Palatino Linotype", "Times New Roman", serif; }
.quote.greek-text { font-size: 1.35rem; line-height: 1.6; }
blockquote.gloss { margin: 0.2rem 0 0.8rem; color: var(--muted); font-size: 0.9rem; font-style: italic; }
.review blockquote.greek-text { font-style: normal; font-size: 1rem; }

.card h2.gameplay { font-size: 1.45rem; font-weight: 700; margin: 0 0 0.4rem; }

/* Start page: dailies on top, then one card per game, then the short how-to and the note. */
.section-label { margin: 1.2rem 0.2rem 0.45rem; font-size: 0.78rem; font-weight: normal; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.section-label:first-child { margin-top: 0.3rem; }
.tiles { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 0.45rem; }
button.tile { display: flex; flex-direction: column; gap: 0.1rem; align-items: center; text-align: center; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 0.5rem 0.25rem; line-height: 1.3; }
button.tile { min-width: 0; }
button.tile strong, button.tile span { white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
/* Sized by the screen width as well, so even large system text keeps every label on one line. */
button.tile strong { font-size: min(0.95rem, 4.2vw); }
button.tile span { font-size: min(0.8rem, 3.5vw); }
button.tile .status-line { font-size: min(0.72rem, 3.1vw); color: var(--muted); }
button.tile:hover { background: #fbf5e6; }
.card.game { margin-top: 0.7rem; }
.card.game h2 { margin: 0 0 0.2rem; font-size: 1.3rem; }
.card.game .blurb { margin: 0 0 0.7rem; font-size: 0.92rem; }
.card.game .modes { margin: 0 0 0.9rem; }
.card.about { margin-top: 1.3rem; }
.card h2.gameplay { font-size: 1.1rem; margin: 0 0 0.3rem; }
.rules.small { font-size: 0.82rem; line-height: 1.45; padding-left: 1.1rem; margin: 0.2rem 0 0.4rem; color: var(--muted); }
.rules.small li { margin: 0.15rem 0; }
div.continue { display: flex; flex-direction: column; align-items: flex-start; gap: 0.1rem; margin: 0.7rem 0.2rem 0; }
div.continue button.link { padding-top: 0.2rem; padding-bottom: 0.2rem; }
.card.about .creator-note { margin-top: 0; }

/* Trivia */
.trivia-q { font-size: 1.3rem; line-height: 1.45; margin: 0.2rem 0 1.1rem; }
.trivia-cat { font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; margin: 0; }
.choices { display: grid; gap: 0.6rem; }
button.choice { text-align: left; background: var(--bg); color: var(--ink); border: 1px solid var(--line); padding: 0.75rem 1rem; line-height: 1.35; }
button.choice:not(:disabled):hover { background: #f3e7c8; }
button.choice .letter { display: inline-block; min-width: 1.4rem; font-weight: bold; color: var(--accent); }
button.choice:disabled { opacity: 1; cursor: default; }
button.choice.right { background: #cfe0f3; border-color: #5b86b8; }
button.choice.wrong { background: #f0d3cb; border-color: #b4574a; }

/* Greek and English side by side after an answer. */
.parallel { display: grid; grid-template-columns: 1fr 1fr; gap: 0.2rem 0.9rem; margin: 0.9rem 0 0.4rem; }
.parallel p { margin: 0; }
.parallel .col-head { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 0.2rem; margin-bottom: 0.2rem; }
.parallel .verse { font-size: 0.95rem; line-height: 1.5; padding: 0.15rem 0.3rem; }
.parallel .verse.greek-text { font-size: 1rem; }
.parallel .verse.target { background: var(--bg); border-radius: 4px; }

.board { margin: 1rem 0; }
.board h3 { margin: 0 0 0.4rem; }
.board-list { list-style: none; margin: 0; padding: 0; }
.board-list li { display: grid; grid-template-columns: 2rem 1fr auto; gap: 0.5rem; padding: 0.3rem 0.5rem; border-bottom: 1px solid var(--line); }
.board-list li.me { font-weight: 700; background: var(--bg); }
.board-list .rank { color: var(--muted); }
.board-list .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.board input[type=text] { flex: 1 1 10rem; min-width: 0; }

.sq { display: inline-block; width: 0.85em; height: 0.85em; border-radius: 0.16em; vertical-align: -0.08em; margin-right: 0.12em; }
.sq.blue { background: #3b82d6; }
.sq.green { background: #5fae4e; }
.sq.yellow { background: #f2c92b; }
.sq.orange { background: #ec8a1f; }
.sq.red { background: #d3342f; }
.board-manage { margin: 0.5rem 0 0; font-size: 0.85rem; display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem; }
.board-manage input[type=text] { flex: 1 1 8rem; min-width: 0; }
.board-manage .x { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 50%; width: 1.5rem; height: 1.5rem; padding: 0; line-height: 1; font-size: 1rem; cursor: pointer; }
.board-manage .x:hover { color: var(--accent); border-color: var(--accent); }


header.site { position: relative; }
.trophy { position: absolute; right: 1rem; top: 2.1rem; width: 2.4rem; height: 2.4rem; padding: 0; display: flex; align-items: center; justify-content: center; background: var(--card); color: var(--accent); border: 1px solid var(--line); border-radius: 50%; cursor: pointer; }
.trophy[hidden] { display: none; }
.trophy:hover { background: #fbf5e6; }
.scrim { position: fixed; inset: 0; background: rgba(74, 42, 34, 0.4); z-index: 50; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 51; max-width: 42rem; margin: 0 auto; max-height: 80vh; overflow-y: auto; background: var(--card); border: 1px solid var(--line); border-bottom: 0; border-radius: 16px 16px 0 0; padding: 1rem 1.1rem 1.4rem; box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.2); }
.sheet .board { margin: 0; }
.sheet-close { position: absolute; right: 0.6rem; top: 0.5rem; background: none; border: 0; color: var(--muted); font-size: 1.6rem; line-height: 1; padding: 0.1rem 0.5rem; cursor: pointer; }

main > .foot-links { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 0 0.3rem; }
main > .foot-links .sep { color: var(--muted); font-size: 0.8rem; }
main > .foot-links .link { padding-left: 0.4rem; padding-right: 0.4rem; }

/* The Dailies stand out: a larger heading, red outlines while unplayed, plain once played. */
.dailies-head { font-size: 1.15rem; font-weight: bold; letter-spacing: 0.01em; text-transform: none; color: var(--accent); margin: 1rem 0.2rem 0.55rem; }
.tiles button.tile { padding: 0.8rem 0.25rem; }
.tiles button.tile.todo { border: 2px solid var(--accent); }
.tiles button.tile.todo strong { font-size: min(1.1rem, 4.9vw); }
.tiles button.tile.todo .status-line { color: var(--accent); font-weight: bold; }
.nudge { background: #e6d6b0; border: 1px solid var(--line); border-radius: 10px; padding: 0.85rem 1rem 1rem; margin: 0.9rem 0; }
.nudge strong { display: block; font-size: 1.05rem; }
.nudge p { margin: 0.2rem 0 0.7rem; font-size: 0.85rem; color: var(--muted); }
.dailies-note { margin: -0.35rem 0.2rem 0.6rem; font-size: 0.82rem; }

/* The selected difficulty dot is the game's red, not the browser's blue. */
input[type=radio] { accent-color: var(--accent); }

.source { margin: -0.75rem 0 1rem; color: var(--muted); font-size: 0.8rem; }
</style>

<header class="site">
<h1>Λογος</h1>
<p>Knowing the Word</p>
</header>
<main id="app"></main>
<footer class="site"><p id="notice"></p></footer>
<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
  import { getFirestore, collection, doc, setDoc, getDocs, query, where, orderBy, limit, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDrgHRGIo7YYUswrgKF99zX5jI7mmSRQT0",
    authDomain: "logos-leaderboard.firebaseapp.com",
    projectId: "logos-leaderboard",
    storageBucket: "logos-leaderboard.firebasestorage.app",
    messagingSenderId: "787691874387",
    appId: "1:787691874387:web:3e2c71d8c167b9a051bea6"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  // Make them available to the rest of the game
  window.db = db;
  window.firestore = { collection, doc, setDoc, getDocs, query, where, orderBy, limit, updateDoc, deleteDoc };

  // ---------- Player identity ----------
  // Each browser signs in anonymously (no email, no password). That gives it a private id the server can check, so only
  // you can rename or remove your own score.
  let uidPromise = null;
  function getOrCreatePlayerId() {
    if (!uidPromise) {
      uidPromise = (async () => {
        await auth.authStateReady();
        if (!auth.currentUser) await signInAnonymously(auth);
        return auth.currentUser.uid;
      })().catch((err) => { uidPromise = null; throw err; });
    }
    return uidPromise;
  }

  function getDisplayName() {
    return localStorage.getItem("locus_displayName") || null;
  }

  function setDisplayName(name) {
    localStorage.setItem("locus_displayName", name.trim().slice(0, 20));
  }

  // The game's Daily rolls over at midnight Eastern, so the leaderboard uses the same day.
  function todayKey() {
    try {
      return new Intl.DateTimeFormat("en-CA", { timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
    } catch (e) {
      return new Date().toISOString().slice(0, 10);
    }
  }

  // ---------- Save a Daily score ----------
  // The Classic Daily and the Greek Daily each have their own collection (board).
  async function submitDailyScore(score, board = "daily_scores") {
    // Everyone who finishes is listed as Anonymous. A name is only published if the player adds one (see renameMe).
    const displayName = "Anonymous";
    const today = todayKey();
    try {
      const playerId = await getOrCreatePlayerId();
      await window.firestore.setDoc(
        window.firestore.doc(window.db, board, `${today}_${playerId}`),
        {
          playerId,
          displayName: displayName.trim().slice(0, 20),
          score: Math.round(score),
          date: today,
          createdAt: new Date()
        }
      );
      return true;
    } catch (err) {
      console.error("Failed to submit score:", err);
      window.boardError = String((err && (err.code || err.message)) || err);
      return false;
    }
  }

  // ---------- Take your score down / change your name ----------
  async function removeMyScore(board = "daily_scores") {
    try {
      const playerId = await getOrCreatePlayerId();
      await window.firestore.deleteDoc(window.firestore.doc(window.db, board, `${todayKey()}_${playerId}`));
      return true;
    } catch (err) {
      console.error("Failed to remove score:", err);
      window.boardError = String((err && (err.code || err.message)) || err);
      return false;
    }
  }

  async function renameMe(name, board = "daily_scores") {
    const clean = String(name || "").trim().slice(0, 20) || "Anonymous";
    setDisplayName(clean);
    try {
      const playerId = await getOrCreatePlayerId();
      await window.firestore.updateDoc(window.firestore.doc(window.db, board, `${todayKey()}_${playerId}`), { displayName: clean });
      return true;
    } catch (err) {
      console.error("Failed to change name:", err);
      window.boardError = String((err && (err.code || err.message)) || err);
      return false;
    }
  }

  // ---------- Get today's leaderboard ----------
  async function getTodayLeaderboard(board = "daily_scores") {
    const today = todayKey();
    try {
      const playerId = await getOrCreatePlayerId().catch(() => null);
      const q = window.firestore.query(
        window.firestore.collection(window.db, board),
        window.firestore.where("date", "==", today),
        window.firestore.orderBy("score", "desc"),
        window.firestore.limit(50) // get a few extra so we can find personal rank
      );

      const snapshot = await window.firestore.getDocs(q);
      const scores = [];
      snapshot.forEach(doc => scores.push(doc.data()));

      // Top 10
      const top10 = scores.slice(0, 10);

      // Personal rank
      let personalRank = null;
      let personalScore = null;
      const myIndex = playerId ? scores.findIndex(s => s.playerId === playerId) : -1;
      if (myIndex !== -1) {
        personalRank = myIndex + 1;
        personalScore = scores[myIndex].score;
      }

      return { top10, personalRank, personalScore };
    } catch (err) {
      console.error("Failed to load leaderboard:", err);
      return { top10: [], personalRank: null, personalScore: null };
    }
  }

  // Make everything available to the rest of the game
  window.getOrCreatePlayerId = getOrCreatePlayerId;
  window.getDisplayName = getDisplayName;
  window.setDisplayName = setDisplayName;
  window.submitDailyScore = submitDailyScore;
  window.getTodayLeaderboard = getTodayLeaderboard;
  window.removeMyScore = removeMyScore;
  window.renameMe = renameMe;
